<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#ffffff" />
        <title>My Account</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 24px;
                box-sizing: border-box;
                font-family: system-ui, sans-serif;
                color: #172033;
                background: #f7f8fb;
                text-align: center;
            }
            main {
                max-width: 420px;
                padding: 32px;
                border: 1px solid #e3e6ee;
                border-radius: 20px;
                background: #fff;
                box-shadow: 0 12px 30px rgb(23 32 51 / 8%);
            }
            h1 {
                margin: 0 0 12px;
                font-size: 1.4rem;
            }
            p {
                margin: 0;
                line-height: 1.6;
                color: #5d6575;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>You’re offline</h1>
            <p>Reconnect to manage your account.</p>
        </main>
    </body>
</html>
